# Unique id of this project inside SonarQube.
sonar.projectKey=translator
sonar.projectName=LLM Translator API
#Folders with application code and with tests
sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12
#Coverage file produced by pytest-cov. Sonar reads it to show % tested.
sonar.python.coverage.reportPaths=coverage.xml