apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  # In-cluster DNS: a Service name resolves to its pods.
  LLM_BASE_URL: "http://{{ .Release.Name }}-ollama:11434"
  REDIS_URL: "redis://{{ .Release.Name }}-redis:6379/0"
  # Loop over values.yaml "config:" and print every key/value.
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}