# Disk for the downloaded model, so it survives pod restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-ollama-models
spec:
  # ReadWriteOnce = mounted by one node at a time.
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.ollama.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ollama
spec:
  replicas: 1
  # Recreate = stop the old pod before starting the new one (one disk, one user).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: ollama
    spec:
      securityContext:
        # Make mounted volumes writable by group 10001.
        fsGroup: 10001
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}
          ports:
            - name: api
              containerPort: 11434
          env:
            # Listen on all interfaces inside the pod.
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            # Store models on the PVC, not in /root (we are not root).
            - name: OLLAMA_MODELS
              value: /models
            # Non-root user has no home folder; /tmp is writable.
            - name: HOME
              value: /tmp
          readinessProbe:
            httpGet: { path: /, port: api }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ollama
spec:
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: ollama
  ports:
    - port: 11434
      targetPort: api
