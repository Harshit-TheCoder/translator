# Only rendered when secret.create is true.
{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
type: Opaque
# stringData takes plain text; Kubernetes stores it base64-encoded.
stringData:
  LLM_API_KEY: {{ .Values.secret.llmApiKey | quote }}
{{- end }}