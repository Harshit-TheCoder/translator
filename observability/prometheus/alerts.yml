groups:
  - name: translator 
    rules: 

      # The app is unreachable 
      - alert: TranslatorDown
        expr: up{job="translator"} == 0 # up is 1 whe scapr works else 0
        for: 1m # must stay 1 for 1 minute 
        labels: 
          severity: critical # used later to decide who gets notified 
        annotations:
          summary: "Translator API is down"  

      # more than 5% requests fail
      - alert: TranslatorHighErrorRate
        expr: |
          sum(rate(translate_requests_total{status="error"}[5m]))
          / sum(rate(translate_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 5% of translations are failing"

      # the slowest 5% of requests take longer than 5 seconds 
      - alert: TranslatorSlow 
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(translate_latency_seconds_bucket[5m]))) > 5
        for: 5m 
        labels: 
          severity: warning 
        annotations:
          summary: "p95 latency is above 5 seconds"
