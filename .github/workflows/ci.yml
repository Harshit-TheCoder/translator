name: clickable

# Run on pushes to main and on pull requests targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the default token only reads repository content.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/harshit-thecoder/translator

jobs:
  # Run tests before building the image.
  test:
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests with coverage
        run: python -m pytest -q --cov=app --cov-report=xml
      - name: Golden-set eval
        run: bash ci/run_eval.sh
      - name: SonarQube scan and quality gate
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: -Dsonar.qualitygate.wait=true

  # Build, scan, and publish the container.
  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha, mode=max
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push'
        run: docker push ${{ env.IMAGE }}:${{ github.sha }}

  # Update the config repo so Argo CD deploys this image.
  gitops:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the config repo
        uses: actions/checkout@v4
        with:
          repository: Harshit-TheCoder/translator-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
      - name: Update image tag and push
        run: |
          sed -i "s|^  tag:.*|  tag: '${{ github.sha }}'|" env/dev/values.yaml
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add env/dev/values.yaml
          git commit -m "chore: translator image ${{ github.sha }}" || echo "nothing to commit"
          git push
